name: CI/CD Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Ubuntu Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/gsai/cpg-app
            git pull origin main
            docker build -t cpg-app:latest .
            docker stop cpg-app-container || true
            docker rm cpg-app-container || true
            docker run -d --name cpg-app-container -p 8080:80 cpg-app:latest